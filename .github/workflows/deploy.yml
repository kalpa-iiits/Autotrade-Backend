name: Test and deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once: the server must only ever run one app process.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --no-deps --require-hashes -r requirements.lock

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Audit locked dependencies
        run: |
          SITE_PACKAGES=$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          uvx pip-audit --path "$SITE_PACKAGES"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      APP_DIR: /home/${{ secrets.EC2_USER }}/autotrade_backend
      NEXT_DIR: /home/${{ secrets.EC2_USER }}/autotrade_backend.next
      PREVIOUS_DIR: /home/${{ secrets.EC2_USER }}/autotrade_backend.previous
      BACKUP_DIR: /home/${{ secrets.EC2_USER }}/autotrade_backups
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare staged release
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "rm -rf '$NEXT_DIR' && mkdir -p '$NEXT_DIR'"

      # Upload into a staging directory. The running release is untouched until its
      # dependencies, production configuration and database backup have all succeeded.
      - name: Upload staged code
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' \
            --exclude '.venv/' --exclude '__pycache__/' --exclude '.pytest_cache/' \
            --exclude '.env' --exclude 'autotrade.db*' --exclude 'autotrade.lock' --exclude 'logs/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$NEXT_DIR/"

      - name: Validate, back up, release, and verify
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR=$APP_DIR NEXT_DIR=$NEXT_DIR PREVIOUS_DIR=$PREVIOUS_DIR BACKUP_DIR=$BACKUP_DIR bash -s" <<'EOF'
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cp "$APP_DIR/.env" "$NEXT_DIR/.env"
          chmod 600 "$NEXT_DIR/.env"
          cd "$NEXT_DIR"
          # Relocatable: this directory is renamed to $APP_DIR below, and a normal venv's
          # entry points (e.g. the uvicorn systemd runs) hard-code their original path.
          uv venv .venv --python 3.11 --relocatable
          uv pip install --no-deps --require-hashes --python .venv/bin/python -r requirements.lock
          .venv/bin/python -m app.core.preflight
          DATABASE_NAME=$(.venv/bin/python -c 'from sqlalchemy.engine import make_url; from app.core.config import settings; print(make_url(settings.database_url).database)')
          PUBLIC_HOST=$(.venv/bin/python -c 'from app.core.config import settings; print(settings.trusted_hosts[0])')

          # Freeze application writes before the backup so an automatic rollback cannot lose
          # orders accepted between a live backup and the release swap.
          sudo systemctl stop autotrade
          if ! BACKUP=$(.venv/bin/python -m scripts.backup_database --output-dir "$BACKUP_DIR"); then
            sudo systemctl start autotrade
            exit 1
          fi
          if ! rm -rf "$PREVIOUS_DIR" || ! mv "$APP_DIR" "$PREVIOUS_DIR"; then
            sudo systemctl start autotrade
            exit 1
          fi
          if ! mv "$NEXT_DIR" "$APP_DIR"; then
            mv "$PREVIOUS_DIR" "$APP_DIR"
            sudo systemctl start autotrade
            exit 1
          fi
          sudo systemctl start autotrade

          healthy=false
          for i in $(seq 1 20); do
            if curl -fsS -H "Host: $PUBLIC_HOST" http://127.0.0.1:8000/health \
              | "$APP_DIR/.venv/bin/python" -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Release failed its health check; restoring database and previous release" >&2
            sudo systemctl stop autotrade || true
            sudo journalctl -u autotrade -n 50 --no-pager >&2 || true
            cd "$APP_DIR"
            # A failed database restore must not leave production stopped: always put the
            # previous release back and start it, then report the restore failure loudly.
            restore_failed=false
            .venv/bin/python -m scripts.restore_database "$BACKUP" --confirm-database "$DATABASE_NAME" \
              || restore_failed=true
            cd "$HOME"
            rm -rf "$NEXT_DIR.failed"
            mv "$APP_DIR" "$NEXT_DIR.failed"
            mv "$PREVIOUS_DIR" "$APP_DIR"
            sudo systemctl start autotrade
            if [ "$restore_failed" = true ]; then
              echo "DATABASE RESTORE FAILED; previous release restarted on the current database. Backup: $BACKUP" >&2
            fi
            exit 1
          fi
          echo "Release is healthy; backup: $BACKUP"
          EOF

      - name: Run authenticated read-only smoke test
        env:
          AUTOTRADE_SMOKE_URL: ${{ vars.PRODUCTION_API_URL }}
          AUTOTRADE_SMOKE_ACCOUNT_ID: ${{ vars.PRODUCTION_SMOKE_ACCOUNT_ID }}
          AUTOTRADE_SMOKE_TOKEN: ${{ secrets.PRODUCTION_SMOKE_TOKEN }}
        run: python scripts/smoke_production.py
