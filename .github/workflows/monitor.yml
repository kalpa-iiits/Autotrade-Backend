name: Monitor production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check health and alert on failure
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          ALERT_WEBHOOK: ${{ secrets.PRODUCTION_ALERT_WEBHOOK_URL }}
        run: |
          test -n "$HEALTH_URL"
          if [ -n "$ALERT_WEBHOOK" ]; then
            python scripts/check_health.py "$HEALTH_URL" --alert-webhook "$ALERT_WEBHOOK"
          else
            python scripts/check_health.py "$HEALTH_URL"
          fi
