<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AutoTrade</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5d6670;
      --border: #d6dae0; --accent: #1f6feb; --accent-text: #ffffff;
      --error-bg: #fdecec; --error-text: #a4161a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #2c313a; --accent: #3b82f6; --accent-text: #ffffff;
        --error-bg: #3a1618; --error-text: #ffb3b5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 360px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%; margin-top: 22px; padding: 11px; font: inherit; font-weight: 600;
      background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .error {
      background: var(--error-bg); color: var(--error-text); border-radius: 8px;
      padding: 10px 12px; font-size: 14px; margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>AutoTrade</h1>
    <p class="sub">Sign in to continue</p>
    $error
    <form method="post" action="/login">
      <input type="hidden" name="next" value="$next">
      <label for="username">Email</label>
      <input id="username" name="username" autocomplete="username" inputmode="email" required autofocus
             value="$username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" $disabled>Sign in</button>
    </form>
  </main>
</body>
</html>
